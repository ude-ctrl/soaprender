<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 385" role="img" aria-labelledby="t d"><title id="t">Uma praça, cinco categorias</title><desc id="d">Uma praça permite analisar cinco categorias complementares.</desc><rect width="600" height="385" rx="12" fill="#f7f6f2"/><g font-family="system-ui,sans-serif" fill="#192320"><text x="24" y="36" font-size="23" font-weight="700">Uma praça, cinco categorias</text><rect x="22" y="55" width="556" height="50" rx="8" fill="#fff" stroke="#17594d"/><text x="37" y="75" font-size="17" font-weight="700" fill="#17594d">Espaço</text><text x="37" y="94" font-size="15">Objetos, ações e usos sociais</text><rect x="22" y="112" width="556" height="50" rx="8" fill="#fff" stroke="#17594d"/><text x="37" y="132" font-size="17" font-weight="700" fill="#17594d">Paisagem</text><text x="37" y="151" font-size="15">Formas visíveis e marcas históricas</text><rect x="22" y="169" width="556" height="50" rx="8" fill="#fff" stroke="#17594d"/><text x="37" y="189" font-size="17" font-weight="700" fill="#17594d">Território</text><text x="37" y="208" font-size="15">Controle, apropriação e conflitos de acesso</text><rect x="22" y="226" width="556" height="50" rx="8" fill="#fff" stroke="#17594d"/><text x="37" y="246" font-size="17" font-weight="700" fill="#17594d">Região</text><text x="37" y="265" font-size="15">Recorte e função em uma rede</text><rect x="22" y="283" width="556" height="50" rx="8" fill="#fff" stroke="#17594d"/><text x="37" y="303" font-size="17" font-weight="700" fill="#17594d">Lugar</text><text x="37" y="322" font-size="15">Vivências, memórias e significados</text><text x="24" y="365" font-size="14">Esquema didático autoral.</text></g></svg>