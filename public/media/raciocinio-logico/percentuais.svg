<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 310" role="img" aria-labelledby="t d"><title id="t">Variações sucessivas</title><desc id="d">100 passa a 125 com aumento de 25 por cento, depois volta a 100 com desconto de 20 por cento.</desc><rect width="600" height="310" rx="12" fill="#f7f6f2"/><g font-family="system-ui,sans-serif" fill="#192320"><text x="24" y="35" font-weight="700" font-size="22">Variações sucessivas</text><g font-size="18" text-anchor="middle"><rect x="30" y="135" width="160" height="100" fill="#b7d9cd" stroke="#17594d"/><text x="110" y="120">100</text><rect x="220" y="110" width="160" height="125" fill="#b7d9cd" stroke="#17594d"/><text x="300" y="95">125</text><rect x="410" y="135" width="160" height="100" fill="#b7d9cd" stroke="#17594d"/><text x="490" y="120">100</text><text x="110" y="260">Inicial</text><text x="300" y="260">× 1,25</text><text x="490" y="260">× 0,80</text><text x="300" y="290">1,25 × 0,80 = 1</text></g></g></svg>