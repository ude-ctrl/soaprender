<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 310" role="img" aria-labelledby="t d"><title id="t">Cadeias de recuperação</title><desc id="d">Incremental: completo segunda, incrementais terça e quarta. Diferencial: completo segunda e diferencial quarta.</desc><rect width="600" height="310" rx="12" fill="#f7f6f2"/><g font-family="system-ui,sans-serif" fill="#192320"><text x="24" y="34" font-size="22" font-weight="700">Cadeias de recuperação</text><g font-size="17"><text x="25" y="77" font-weight="700">Incremental</text><text x="25" y="199" font-weight="700">Diferencial</text><rect x="25" y="90" width="170" height="52" rx="7" fill="#b7d9cd" stroke="#17594d"/><text x="110" y="122" text-anchor="middle">Completo</text><rect x="215" y="90" width="170" height="52" rx="7" fill="#b7d9cd" stroke="#17594d"/><text x="300" y="122" text-anchor="middle">Inc. terça</text><rect x="405" y="90" width="170" height="52" rx="7" fill="#b7d9cd" stroke="#17594d"/><text x="490" y="122" text-anchor="middle">Inc. quarta</text><rect x="25" y="212" width="170" height="52" rx="7" fill="#b7d9cd" stroke="#17594d"/><text x="110" y="244" text-anchor="middle">Completo</text><rect x="215" y="212" width="170" height="52" rx="7" fill="#e3e3df" stroke="#17594d"/><text x="300" y="244" text-anchor="middle">Dif. terça</text><rect x="405" y="212" width="170" height="52" rx="7" fill="#b7d9cd" stroke="#17594d"/><text x="490" y="244" text-anchor="middle">Dif. quarta</text><text x="25" y="164">Restaurar: completo + os dois incrementais.</text><text x="25" y="286">Restaurar: completo + diferencial de quarta.</text></g></g></svg>