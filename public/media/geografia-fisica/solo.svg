<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" role="img" aria-labelledby="t d"><title id="t">Perfil de solo hipotético</title><desc id="d">Horizontes O, A, E, B, C e rocha R. Nem todos os solos apresentam todos eles.</desc><rect width="720" height="410" rx="14" fill="#f8f6ee"/><g font-family="system-ui,sans-serif" fill="#173e36" font-size="19"><text x="360" y="38" text-anchor="middle" font-size="24" font-weight="bold">Perfil de solo hipotético</text><g stroke="#725e49"><rect x="90" y="68" width="235" height="27" fill="#544c36"/><rect x="90" y="95" width="235" height="55" fill="#8b6a4c"/><rect x="90" y="150" width="235" height="35" fill="#d7c6a3"/><rect x="90" y="185" width="235" height="81" fill="#b6754b"/><rect x="90" y="266" width="235" height="55" fill="#d7a979"/><rect x="90" y="321" width="235" height="39" fill="#a6aaa4"/></g><g font-weight="bold"><text x="351" y="89">O · material orgânico</text><text x="351" y="129">A · mineral + matéria orgânica</text><text x="351" y="174">E · frequentemente eluviado</text><text x="351" y="230">B · desenvolvimento pedogenético</text><text x="351" y="299">C · material pouco alterado</text><text x="351" y="347">R · rocha consolidada</text></g><text x="360" y="390" text-anchor="middle" font-size="15">SOaprender · esquema didático, sem escala</text></g></svg>
