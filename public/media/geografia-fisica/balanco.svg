<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" role="img" aria-labelledby="t d"><title id="t">Balanço hídrico simplificado</title><desc id="d">Precipitação 100 mm, evapotranspiração 40 mm, escoamento 45 mm; armazenamento aumenta 15 mm.</desc><rect width="720" height="410" rx="14" fill="#f8f6ee"/><g font-family="system-ui,sans-serif" fill="#173e36" font-size="19"><text x="360" y="38" text-anchor="middle" font-size="24" font-weight="bold">Balanço hídrico simplificado</text><defs><marker id="a" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto"><path d="M0 0L6 3L0 6Z" fill="#17594d"/></marker></defs><rect x="193" y="140" width="310" height="136" rx="12" fill="#d4e2cd" stroke="#17594d" stroke-width="2"/><g stroke="#17594d" stroke-width="4" marker-end="url(#a)"><path d="M245 77V130"/><path d="M435 130V77"/><path d="M513 205H625"/></g><text x="150" y="64" font-size="17">P = 100 mm</text><text x="409" y="64" font-size="17">ET = 40 mm</text><text x="520" y="189" font-size="17">Q = 45 mm</text><text x="348" y="192" text-anchor="middle" font-weight="bold">Bacia</text><text x="348" y="235" text-anchor="middle" font-size="22">ΔS = +15 mm</text><text x="360" y="327" text-anchor="middle" font-weight="bold">100 − 40 − 45 = 15 mm</text><text x="360" y="352" text-anchor="middle" font-size="16">Hipótese: sem transferências externas adicionais.</text><text x="360" y="390" text-anchor="middle" font-size="15">SOaprender · esquema didático, sem escala</text></g></svg>
