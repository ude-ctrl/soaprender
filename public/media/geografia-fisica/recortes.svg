<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 410" role="img" aria-labelledby="t d"><title id="t">Três recortes, três perguntas</title><desc id="d">Bioma, domínio morfoclimático e cobertura da terra são categorias distintas.</desc><rect width="720" height="410" rx="14" fill="#f8f6ee"/><g font-family="system-ui,sans-serif" fill="#173e36" font-size="19"><text x="360" y="38" text-anchor="middle" font-size="24" font-weight="bold">Três recortes, três perguntas</text><g fill="#e0e8d8" stroke="#729383"><rect x="25" y="75" width="210" height="235" rx="10"/><rect x="255" y="75" width="210" height="235" rx="10"/><rect x="485" y="75" width="210" height="235" rx="10"/></g><g text-anchor="middle" font-weight="bold"><text x="130" y="111">Bioma</text><text x="360" y="111">Domínio</text><text x="590" y="111">Cobertura da terra</text></g><g font-size="16" text-anchor="middle"><text x="130" y="155">Conjunto regional</text><text x="130" y="179">de ambientes</text><text x="360" y="155">Síntese de relevo,</text><text x="360" y="179">clima, solos e vida</text><text x="590" y="155">O que ocupa o solo</text><text x="590" y="179">em uma data</text><text x="130" y="240">Ex.: Cerrado (IBGE)</text><text x="360" y="240">Ex.: Cerrados</text><text x="360" y="264">(Ab’Sáber)</text><text x="590" y="240">Ex.: lavoura, floresta</text><text x="590" y="264">ou área urbana</text></g><text x="360" y="350" text-anchor="middle" font-weight="bold">Os limites não são automaticamente iguais.</text><text x="360" y="390" text-anchor="middle" font-size="15">SOaprender · esquema didático, sem escala</text></g></svg>
