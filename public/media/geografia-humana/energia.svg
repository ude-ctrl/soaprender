<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="t d"><title id="t">Geração elétrica brasileira · 2025</title><desc id="d">Renováveis 86,6 por cento, não renováveis 13,4 por cento, da geração elétrica nacional. Complemento calculado a partir do percentual não renovável do BEN 2026.</desc><rect width="720" height="420" rx="14" fill="#f8f6ee"/><g font-family="system-ui,sans-serif" fill="#173e36" font-size="19"><text x="360" y="36" text-anchor="middle" font-size="24" font-weight="bold">Geração elétrica brasileira · 2025</text><text x="50" y="91" font-size="17">Participação na geração nacional de eletricidade</text><rect x="50" y="112" width="620" height="100" rx="8" fill="#d5e4d5"/><rect x="50" y="112" width="536.92" height="100" rx="8" fill="#386f5f"/><rect x="586.92" y="112" width="83.08" height="100" fill="#b48b48"/><text x="318" y="170" text-anchor="middle" font-size="29" font-weight="bold" fill="#fff">86,6%</text><text x="628" y="170" text-anchor="middle" font-size="19" font-weight="bold" fill="#192320">13,4%</text><rect x="50" y="240" width="18" height="18" fill="#386f5f"/><text x="79" y="255">Renováveis</text><rect x="340" y="240" width="18" height="18" fill="#b48b48"/><text x="369" y="255">Não renováveis</text><text x="360" y="305" text-anchor="middle" font-weight="bold">Geração ≠ oferta interna ≠ matriz energética total</text><text x="360" y="342" text-anchor="middle" font-size="16">86,6 = 100 − 13,4; percentuais arredondados.</text><text x="360" y="399" text-anchor="middle" font-size="15">Fonte: EPE, BEN 2026, capítulo 1, ano-base 2025.</text></g></svg>
