<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="t d"><title id="t">Níveis de integração econômica</title><desc id="d">Cada estágio acrescenta características, sem sequência histórica obrigatória.</desc><rect width="720" height="420" rx="14" fill="#f8f6ee"/><g font-family="system-ui,sans-serif" fill="#173e36" font-size="19"><text x="360" y="36" text-anchor="middle" font-size="24" font-weight="bold">Níveis de integração econômica</text><g stroke="#628878" stroke-width="1.5"><rect x="44" y="76" width="632" height="62" rx="8" fill="#dce8d9"/><rect x="76" y="147" width="600" height="62" rx="8" fill="#ccdfcd"/><rect x="108" y="218" width="568" height="62" rx="8" fill="#b5d3bf"/><rect x="140" y="289" width="536" height="62" rx="8" fill="#92bea8"/></g><g font-weight="bold"><text x="60" y="101">Livre comércio</text><text x="92" y="172">União aduaneira</text><text x="124" y="243">Mercado comum</text><text x="156" y="314">União econômica / monetária</text></g><g font-size="16"><text x="60" y="122">Liberalização interna; tarifas externas próprias</text><text x="92" y="193">+ Política tarifária externa comum</text><text x="124" y="264">+ Circulação de fatores de produção</text><text x="156" y="335">+ Coordenação aprofundada; moeda comum quando instituída</text></g><text x="360" y="399" text-anchor="middle" font-size="15">Modelo analítico: etapas não são obrigatórias; há exceções.</text></g></svg>
