<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="t d"><title id="t">Crescimento urbano não é urbanização</title><desc id="d">Em dois períodos, população urbana de 40 e 45 mil, totais de 100 e 120 mil. Proporções 40% e 37,5%.</desc><rect width="720" height="420" rx="14" fill="#f8f6ee"/><g font-family="system-ui,sans-serif" fill="#173e36" font-size="18"><text x="360" y="37" text-anchor="middle" font-size="23" font-weight="bold">Crescimento urbano não é urbanização</text><text x="46" y="82">Período 1 — 100 mil habitantes</text><rect x="46" y="99" width="500" height="60" rx="5" fill="#ddd4bd"/><rect x="46" y="99" width="200" height="60" rx="5" fill="#397364"/><text x="146" y="135" text-anchor="middle" fill="#fff" font-weight="bold">40 mil</text><text x="396" y="135" text-anchor="middle">60 mil</text><text x="46" y="188" font-weight="bold">40%</text><text x="46" y="229">Período 2 — 120 mil habitantes</text><rect x="46" y="245" width="600" height="60" rx="5" fill="#ddd4bd"/><rect x="46" y="245" width="225" height="60" rx="5" fill="#397364"/><text x="158" y="281" text-anchor="middle" fill="#fff" font-weight="bold">45 mil</text><text x="459" y="281" text-anchor="middle">75 mil</text><text x="46" y="333" font-weight="bold">37,5%</text><rect x="265" y="342" width="18" height="18" fill="#397364"/><text x="293" y="357">Urbana</text><rect x="405" y="342" width="18" height="18" fill="#ddd4bd"/><text x="433" y="357">Rural</text><text x="360" y="399" text-anchor="middle" font-size="14">Dados hipotéticos · barras em escala comum de habitantes</text></g></svg>
