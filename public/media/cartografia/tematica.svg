<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="t d"><title id="t">Total versus densidade</title><desc id="d">A tem 10 mil habitantes e densidade 1000; B tem 20 mil habitantes e densidade 200.</desc><rect width="720" height="420" rx="16" fill="#f8f6ee"/><g font-family="system-ui,sans-serif" font-size="19" fill="#173e36"><text x="180" y="42" text-anchor="middle" font-size="23" font-weight="bold">População total</text><text x="540" y="42" text-anchor="middle" font-size="23" font-weight="bold">Densidade</text><path d="M360 60V345" stroke="#9ba8a0"/><circle cx="90" cy="125" r="34" fill="#c6a462" stroke="#755c31"/><circle cx="260" cy="125" r="48.083261120685236" fill="#c6a462" stroke="#755c31"/><text x="90" y="205" text-anchor="middle">A: 10.000</text><text x="260" y="205" text-anchor="middle">B: 20.000</text><text x="90" y="240" text-anchor="middle" font-size="16">10 km²</text><text x="260" y="240" text-anchor="middle" font-size="16">100 km²</text><rect x="405" y="85" width="120" height="120" fill="#245c4a"/><rect x="555" y="85" width="120" height="120" fill="#a8cab5"/><text x="465" y="138" text-anchor="middle" fill="#fff" font-weight="bold">A</text><text x="465" y="167" text-anchor="middle" fill="#fff">1.000</text><text x="615" y="138" text-anchor="middle" font-weight="bold">B</text><text x="615" y="167" text-anchor="middle">200</text><text x="540" y="239" text-anchor="middle">habitantes/km²</text><text x="180" y="290" text-anchor="middle" font-size="16">Área dos círculos ∝ total</text><text x="540" y="290" text-anchor="middle" font-size="16">Mais escuro = maior densidade</text><text x="360" y="365" text-anchor="middle" font-weight="bold">B tem mais habitantes; A tem maior densidade.</text><text x="360" y="397" text-anchor="middle" font-size="14">SOaprender · dados fictícios · cartões não representam áreas territoriais</text></g></svg>
