<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 460" role="img" aria-labelledby="t d"><title id="t">Coordenadas geográficas em grade angular</title><desc id="d">Ponto P em latitude 20 graus sul e longitude 40 graus oeste. Equador e Greenwich são as referências zero.</desc><rect width="720" height="460" rx="16" fill="#f8f6ee"/><g font-family="system-ui,sans-serif" fill="#173e36" font-size="19"><text x="360" y="35" text-anchor="middle" font-size="24" font-weight="bold">Latitude e longitude</text><g fill="none" stroke="#97aaa3"><path d="M110 80H610V360H110Z M110 136H610 M110 192H610 M110 248H610 M110 304H610 M210 80V360 M310 80V360 M410 80V360 M510 80V360"/></g><path d="M110 192H610 M310 80V360" stroke="#316c5d" stroke-width="3"/><g text-anchor="end"><text x="98" y="86">40° N</text><text x="98" y="142">20° N</text><text x="98" y="198">0°</text><text x="98" y="254">20° S</text><text x="98" y="310">40° S</text><text x="98" y="366">60° S</text></g><g text-anchor="middle"><text x="110" y="388">40° O</text><text x="210" y="388">20° O</text><text x="310" y="388">0°</text><text x="410" y="388">20° L</text><text x="510" y="388">40° L</text><text x="610" y="388">60° L</text></g><circle cx="110" cy="248" r="8" fill="#b17b32" stroke="#173e36" stroke-width="2"/><rect x="127" y="259" width="194" height="37" rx="5" fill="#f8f6ee"/><text x="137" y="284" font-weight="bold">P (20° S, 40° O)</text><rect x="448" y="166" width="150" height="25" fill="#f8f6ee"/><text x="453" y="185" font-weight="bold">Equador</text><rect x="320" y="84" width="133" height="25" fill="#f8f6ee"/><text x="326" y="104" font-size="17">Greenwich</text><text x="360" y="434" text-anchor="middle" font-size="15">SOaprender · grade angular hipotética · não mede distância</text></g></svg>
