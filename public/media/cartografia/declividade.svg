<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="t d"><title id="t">Declividade e perfil</title><desc id="d">200 m horizontais e 40 m de desnível, declividade de 20 por cento.</desc><rect width="720" height="420" rx="16" fill="#f8f6ee"/><g font-family="system-ui,sans-serif" font-size="19" fill="#173e36"><path d="M80 290H580V190Z" fill="#d4e2cd" stroke="#366656" stroke-width="3"/><path d="M80 310H580m-500 -7v14m500 -14v14" stroke="#173e36" stroke-width="2"/><text x="330" y="340" text-anchor="middle">200 m (horizontal)</text><path d="M600 190V290m-7 -100h14m-14 100h14" stroke="#173e36" stroke-width="2"/><text x="615" y="246">40 m</text><text x="80" y="267">A</text><text x="580" y="169">B</text><text x="360" y="65" text-anchor="middle" font-weight="bold" font-size="25">Declividade = 40 ÷ 200 × 100 = 20%</text><text x="360" y="106" text-anchor="middle">Inclinação angular = arctan(0,2) ≈ 11,3°.</text><text x="360" y="395" text-anchor="middle" font-size="15">SOaprender · exemplo hipotético · mesma escala nos dois eixos</text></g></svg>
