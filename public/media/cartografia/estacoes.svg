<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 420" role="img" aria-labelledby="t d"><title id="t">Solstícios de junho e dezembro</title><desc id="d">O eixo da Terra mantém orientação aproximadamente paralela. No desenho de junho, o norte está voltado ao Sol; em dezembro, o sul.</desc><rect width="720" height="420" rx="16" fill="#f8f6ee"/><g font-family="system-ui,sans-serif" fill="#173e36" font-size="18"><text x="360" y="35" text-anchor="middle" font-size="24" font-weight="bold">Inclinação axial e estações</text><circle cx="360" cy="185" r="48" fill="#efc77a" stroke="#a86b29" stroke-width="2"/><text x="360" y="191" text-anchor="middle" font-weight="bold">Sol</text><g stroke="#b17b32" stroke-width="2" fill="none"><path d="M299 151H210l10 -6m-10 6 10 6 M299 185H210l10 -6m-10 6 10 6 M299 219H210l10 -6m-10 6 10 6 M421 151H510l-10 -6m10 6 -10 6 M421 185H510l-10 -6m10 6 -10 6 M421 219H510l-10 -6m10 6 -10 6"/></g><g><circle cx="145" cy="185" r="59" fill="#719995"/><path d="M145 126A59 59 0 0 1 145 244Z" fill="#b9d8dc"/><circle cx="575" cy="185" r="59" fill="#719995"/><path d="M575 126A59 59 0 0 0 575 244Z" fill="#b9d8dc"/></g><g stroke="#173e36" stroke-width="3" stroke-linecap="round"><path d="M109 268L181 102 M539 268L611 102"/></g><g stroke="#173e36" stroke-width="2" stroke-dasharray="5 4"><path d="M91 161L199 209 M521 161L629 209"/></g><g text-anchor="middle" font-weight="bold"><text x="187" y="91">N</text><text x="105" y="286">S</text><text x="617" y="91">N</text><text x="535" y="286">S</text><text x="145" y="315">Junho</text><text x="575" y="315">Dezembro</text></g><g font-size="16" text-anchor="middle"><text x="145" y="340">Verão no Norte</text><text x="145" y="361">Inverno no Sul</text><text x="575" y="340">Inverno no Norte</text><text x="575" y="361">Verão no Sul</text><text x="360" y="400" font-size="14">SOaprender · posições em épocas distintas · esquema sem escala</text></g></g></svg>
