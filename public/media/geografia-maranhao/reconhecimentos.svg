<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 350" role="img" aria-labelledby="t d"><title id="t">Reconhecimentos e categorias ambientais</title><desc id="d">Ramsar reconhece áreas úmidas, UNESCO reconhece patrimônio mundial e SNUC estabelece categorias legais nacionais. Podem coexistir.</desc><rect width="600" height="350" rx="12" fill="#f7f6f2"/><g font-family="system-ui,sans-serif" fill="#192320"><text x="26" y="37" font-size="23" font-weight="700">Três instrumentos distintos</text><rect x="22" y="59" width="556" height="77" rx="8" fill="#fff" stroke="#17594d"/><text x="39" y="82" font-size="18" font-weight="700" fill="#17594d">Ramsar</text><text x="39" y="104" font-size="16">Áreas úmidas de importância internacional</text><text x="39" y="125" font-size="15">Baixada e Reentrâncias</text><rect x="22" y="147" width="556" height="77" rx="8" fill="#fff" stroke="#17594d"/><text x="39" y="170" font-size="18" font-weight="700" fill="#17594d">UNESCO</text><text x="39" y="192" font-size="16">Patrimônio Mundial natural ou cultural</text><text x="39" y="213" font-size="15">Lençóis Maranhenses (2024)</text><rect x="22" y="235" width="556" height="77" rx="8" fill="#fff" stroke="#17594d"/><text x="39" y="258" font-size="18" font-weight="700" fill="#17594d">SNUC</text><text x="39" y="280" font-size="16">Categorias jurídicas de conservação</text><text x="39" y="301" font-size="15">Parques, reservas biológicas e APAs</text><text x="26" y="336" font-size="15">Os instrumentos podem coexistir; um não substitui o outro.</text></g></svg>