<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" role="img" aria-labelledby="t d"><title id="t">Escalas regionais do Maranhão</title><desc id="d">Nordeste contém Maranhão, dividido estatisticamente em cinco regiões intermediárias e 22 imediatas; 217 municípios constituem recorte administrativo.</desc><rect width="600" height="340" rx="12" fill="#f7f6f2"/><g font-family="system-ui,sans-serif" text-anchor="middle" fill="#192320"><text x="300" y="36" font-size="22" font-weight="700">Escalas e finalidades</text><rect x="16" y="60" width="568" height="45" rx="8" fill="#17594d"/><text x="300" y="89" font-size="20" fill="#fff">Nordeste — grande região do IBGE</text><path d="M300 105V126M158 145V126H442V145" stroke="#17594d" stroke-width="3" fill="none"/><g fill="#fff" stroke="#17594d" stroke-width="2"><rect x="16" y="145" width="284" height="145" rx="8"/><rect x="316" y="145" width="268" height="145" rx="8"/></g><g font-size="19"><text x="158" y="175" font-weight="700">Recorte estatístico</text><text x="158" y="210">5 intermediárias</text><text x="158" y="243">22 imediatas</text><text x="158" y="272" font-size="15">IBGE 2017/2018</text><text x="450" y="175" font-weight="700">Recorte administrativo</text><text x="450" y="218" font-size="24">217 municípios</text><text x="450" y="249" font-size="16">Autonomia municipal</text></g><text x="300" y="320" font-size="15">Maranhão — finalidades distintas; esquema sem mapa.</text></g></svg>