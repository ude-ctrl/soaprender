<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 330" role="img" aria-labelledby="t d"><title id="t">Conexões ferroviárias do Porto do Itaqui</title><desc id="d">A Norte-Sul encontra a EFC em Açailândia. A EFC e a FTL têm acesso direto ao Porto do Itaqui. Esquema não geográfico.</desc><rect width="600" height="330" rx="12" fill="#f7f6f2"/><g font-family="system-ui,sans-serif" fill="#192320" text-anchor="middle"><text x="300" y="35" font-size="22" font-weight="700">Conexões do Porto do Itaqui</text><g stroke="#17594d" stroke-width="4" fill="none"><path d="M185 104H305V161H416"/><path d="M185 161H416"/><path d="M185 231H335V161"/></g><g fill="#fff" stroke="#17594d" stroke-width="2"><rect x="22" y="80" width="163" height="48" rx="8"/><rect x="22" y="137" width="163" height="48" rx="8"/><rect x="22" y="207" width="163" height="48" rx="8"/><rect x="416" y="137" width="160" height="48" rx="8"/></g><g font-size="17" font-weight="600"><text x="104" y="110">Norte-Sul (FNS)</text><text x="104" y="166">Carajás (EFC)</text><text x="104" y="236">FTL</text><text x="496" y="167">Porto do Itaqui</text></g><circle cx="305" cy="161" r="6" fill="#17594d"/><text x="305" y="193" font-size="16">Açailândia</text><text x="300" y="284" font-size="15">FNS: ligação indireta pela EFC; EFC e FTL: diretas.</text><text x="300" y="307" font-size="14">Fonte: EMAP, infraestrutura; esquema sem escala.</text></g></svg>