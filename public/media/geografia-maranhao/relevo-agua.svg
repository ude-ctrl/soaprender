<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 340" role="img" aria-labelledby="t d"><title id="t">Relação entre relevo e drenagem</title><desc id="d">Uma chapada elevada apresenta vertentes que conduzem água aos cursos fluviais e terras baixas. Esquema conceitual sem escala.</desc><rect width="600" height="340" rx="12" fill="#f7f6f2"/><g font-family="system-ui,sans-serif" fill="#192320"><text x="24" y="35" font-size="22" font-weight="700">Relevo, vertentes e drenagem</text><path d="M20 254L20 155L65 99H215L255 166L300 218L345 239L390 239L410 224L435 244L580 244V280H20Z" fill="#bd9b70" stroke="#7c654a" stroke-width="2"/><path d="M66 99H215L255 166L300 218" fill="none" stroke="#17594d" stroke-width="5"/><path d="M215 112L246 169L285 217L332 239" fill="none" stroke="#276f9a" stroke-width="4" stroke-linecap="round"/><path d="M328 239H391L410 230L435 244H579" fill="none" stroke="#276f9a" stroke-width="5"/><g font-size="17"><text x="86" y="84">Topo de chapada</text><text x="257" y="141">Vertente</text><text x="333" y="205">Curso de água</text><text x="459" y="224">Terra baixa</text><text x="24" y="309" font-size="15">Esquema sem escala; não é perfil topográfico real do Maranhão.</text></g></g></svg>