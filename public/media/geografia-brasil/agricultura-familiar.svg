<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 330" role="img" aria-labelledby="title desc"><title id="title">Agricultura familiar, Brasil, Censo Agropecuário 2017</title><desc id="desc">Estabelecimentos 77%, área 23%, pessoas ocupadas 67%. Cada barra tem denominador próprio.</desc><rect width="560" height="330" rx="14" fill="#f7f6f2"/><g font-family="system-ui,sans-serif" fill="#192320"><text x="22" y="35" font-size="22" font-weight="700">Agricultura familiar — Brasil, 2017</text><text x="22" y="67" font-size="16">Participação no total de cada indicador</text><text x="22" y="107" font-size="17">Estabelecimentos</text><rect x="22" y="115" width="450" height="19" rx="3" fill="#d7dcd8"/><rect x="22" y="115" width="346.5" height="19" rx="3" fill="#17594d"/><text x="484" y="131" font-size="19" font-weight="700">77%</text><text x="22" y="175" font-size="17">Área dos estabelecimentos</text><rect x="22" y="183" width="450" height="19" rx="3" fill="#d7dcd8"/><rect x="22" y="183" width="103.5" height="19" rx="3" fill="#17594d"/><text x="484" y="199" font-size="19" font-weight="700">23%</text><text x="22" y="243" font-size="17">Pessoas ocupadas nos estabelecimentos</text><rect x="22" y="251" width="450" height="19" rx="3" fill="#d7dcd8"/><rect x="22" y="251" width="301.5" height="19" rx="3" fill="#17594d"/><text x="484" y="267" font-size="19" font-weight="700">67%</text><text x="22" y="310" font-size="15">Fonte: IBGE, Censo Agropecuário 2017 (resultados de 2019).</text></g></svg>