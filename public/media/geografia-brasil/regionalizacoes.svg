<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 370" role="img" aria-labelledby="title desc"><title id="title">Três formas de regionalizar o Brasil</title><desc id="desc">O mesmo território é analisado por três critérios: IBGE, Geiger e Santos e Silveira. Esquema sem mapa.</desc><rect width="600" height="370" rx="14" fill="#f7f6f2"/><g font-family="system-ui,sans-serif" fill="#192320" text-anchor="middle"><text x="300" y="40" font-size="23" font-weight="700">Mesmo território, critérios distintos</text><rect x="175" y="61" width="250" height="48" rx="8" fill="#17594d"/><text x="300" y="92" font-size="20" fill="white">Brasil</text><path d="M300 109V132M100 151V132H500V151M300 132V151" fill="none" stroke="#17594d" stroke-width="3"/><g fill="#fff" stroke="#17594d"><rect x="16" y="151" width="168" height="150" rx="8"/><rect x="216" y="151" width="168" height="150" rx="8"/><rect x="416" y="151" width="168" height="150" rx="8"/></g><g font-size="19" font-weight="700"><text x="100" y="180">IBGE</text><text x="300" y="180">Geiger</text><text x="500" y="180">Santos e</text><text x="500" y="203">Silveira</text></g><g font-size="17"><text x="100" y="215">5 grandes</text><text x="100" y="237">regiões</text><text x="100" y="272">Limites estaduais</text><text x="300" y="215">3 complexos</text><text x="300" y="237">regionais</text><text x="300" y="272">História e economia</text><text x="500" y="237">4 Brasis</text><text x="500" y="264">Densidade técnica</text><text x="500" y="286">e informacional</text></g><text x="300" y="336" font-size="16">Esquema conceitual — não representa limites geográficos.</text></g></svg>